[project]
name = "secondbrain"
version = "0.1.0"
description = "Simple task management API with Flask"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "email-validator>=2.3.0",
    "flask>=3.1.2",
    "flask-jwt-extended>=4.7.1",
    "flask-restx>=1.3.2",
    "flask-sqlalchemy>=3.1.1",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disable_error_code = ["name-defined", "no-any-return", "dict-item"]
exclude = ["migrations/"]
